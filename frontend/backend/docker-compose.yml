version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pds_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://pds_user:pds_password@db:5432/pds_sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=replace_this_with_a_secure_cryptographic_random_key_64_bytes_long
      - API_PREFIX=/api/v1
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - log_volume:/workspace/logs

  db:
    image: postgres:16-alpine
    container_name: pds_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pds_user
      - POSTGRES_PASSWORD=pds_password
      - POSTGRES_DB=pds_sentinel_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pds_user -d pds_sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pds_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  log_volume:
